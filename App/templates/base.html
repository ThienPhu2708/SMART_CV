<!DOCTYPE html>
<html lang="vi" x-data>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SmartCV{% endblock %} — Hệ thống Sàng lọc CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            surface: '#ffffff',
            muted: '#64748b',
            accent: '#475569',
            dark: '#1e293b',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<aside class="sidebar w-60 flex-shrink-0 bg-white border-r border-slate-200 flex flex-col">
  <!-- Logo -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-100">
    <div class="w-9 h-9 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold text-sm">CV</div>
    <div>
      <p class="font-semibold text-sm text-slate-900">CV Screening</p>
      <p class="text-xs text-slate-400">SmartCV v2.0</p>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
    <p class="text-xs font-semibold text-slate-400 px-2 mb-2 uppercase tracking-wider">Tổng quan</p>

    <a href="/"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'dashboard' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Dashboard
    </a>

    <p class="text-xs font-semibold text-slate-400 px-2 mt-4 mb-2 uppercase tracking-wider">Quy trình</p>

    <a href="/jobs/new"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'jobs' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      Tạo Job
    </a>

    <a href="/upload"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'upload' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      Upload CV
    </a>

    <a href="/results"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'results' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      Kết quả
    </a>

    <p class="text-xs font-semibold text-slate-400 px-2 mt-4 mb-2 uppercase tracking-wider">Khác</p>

    <a href="/history"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'history' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Lịch sử
    </a>

    <a href="/settings"
       class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all
              {% if active_page == 'settings' %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Cài đặt
    </a>
  </nav>

  <!-- Footer -->
  <div class="px-5 py-4 border-t border-slate-100">
    <p class="text-xs text-slate-400">HUIT Deep Learning Project</p>
  </div>
</aside>

<!-- ── Main area ─────────────────────────────────────────────────────────────── -->
<div class="flex-1 flex flex-col overflow-hidden">

  <!-- Topbar -->
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between flex-shrink-0">
    <div>
      <h1 class="text-xl font-bold text-slate-900">{% block page_title %}Dashboard{% endblock %}</h1>
      <p class="text-sm text-slate-500">{% block page_subtitle %}Tổng quan hệ thống{% endblock %}</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center text-sm font-semibold text-slate-600">HR</div>
      <span class="text-sm text-slate-600">HR Admin</span>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto p-8">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- ── Toast container ───────────────────────────────────────────────────────── -->
<div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
